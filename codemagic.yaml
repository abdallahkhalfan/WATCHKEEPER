workflows:
  watchkeeper-android:
    name: WATCHKEEPER 4 Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      # ---------------------------------------------------------
      # 1. CREATE A FRESH ANDROID PROJECT
      # ---------------------------------------------------------
      - name: Recreate WATCHKEEPER Android project
        script: |
          set -e

          rm -rf android
          rm -rf test
          rm -f analysis_options.yaml

          flutter create \
            --org com.abdallahkhalfan \
            --platforms=android \
            .

          rm -rf test
          rm -f analysis_options.yaml

      # ---------------------------------------------------------
      # 2. ADD FIREBASE CONFIGURATION
      # ---------------------------------------------------------
      - name: Configure Firebase
        script: |
          set -e

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json was not found in repository root."
            exit 1
          fi

          cp google-services.json android/app/google-services.json

          python3 <<'PY'
          from pathlib import Path

          # -----------------------------------------------------
          # Add Google Services plugin to project settings
          # -----------------------------------------------------
          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          marker = 'id("com.android.application") version'
          google_plugin = 'id("com.google.gms.google-services") version "4.5.0" apply false'

          if google_plugin not in text:
              lines = text.splitlines()
              result = []
              added = False

              for line in lines:
                  result.append(line)

                  if marker in line and not added:
                      indent = line[:len(line) - len(line.lstrip())]
                      result.append(indent + google_plugin)
                      added = True

              text = "\n".join(result) + "\n"
              settings.write_text(text)

          # -----------------------------------------------------
          # Enable Google Services plugin in app Gradle
          # -----------------------------------------------------
          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()

          google_app_plugin = 'id("com.google.gms.google-services")'

          if google_app_plugin not in g:
              marker = 'id("com.android.application")'
              g = g.replace(
                  marker,
                  marker + '\n    ' + google_app_plugin,
                  1
              )

          gradle.write_text(g)

          print("Firebase Google Services configuration completed.")
          PY

      # ---------------------------------------------------------
      # 3. ANDROID PERMISSIONS + NOTIFICATION SUPPORT
      # ---------------------------------------------------------
      - name: Configure Android permissions and notifications
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
          """

          manifest_tag = (
              '<manifest xmlns:android='
              '"http://schemas.android.com/apk/res/android">'
          )

          if "android.permission.POST_NOTIFICATIONS" not in text:
              text = text.replace(
                  manifest_tag,
                  manifest_tag + "\n" + permissions
              )

          receivers = """
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />

                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">

                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>

                  </receiver>
          """

          if "ScheduledNotificationReceiver" not in text:
              text = text.replace(
                  "</application>",
                  receivers + "\n    </application>"
              )

          manifest.write_text(text)

          print("Android permissions configured.")
          PY

      # ---------------------------------------------------------
      # 4. ENABLE CORE LIBRARY DESUGARING
      # ---------------------------------------------------------
      - name: Configure Android desugaring
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()

          if "isCoreLibraryDesugaringEnabled = true" not in g:
              g = g.replace(
                  "compileOptions {",
                  """compileOptions {
                  isCoreLibraryDesugaringEnabled = true""",
                  1
              )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4")'
          )

          if dependency not in g:
              g += """

          dependencies {
              coreLibraryDesugaring(
                  "com.android.tools:desugar_jdk_libs:2.1.4"
              )
          }
          """

          gradle.write_text(g)

          print("Core library desugaring enabled.")
          PY

      # ---------------------------------------------------------
      # 5. GET FLUTTER/FIREBASE PACKAGES
      # ---------------------------------------------------------
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      # ---------------------------------------------------------
      # 6. CHECK FIREBASE FILE
      # ---------------------------------------------------------
      - name: Verify Firebase configuration
        script: |
          set -e

          echo "Checking Firebase configuration..."

          test -f android/app/google-services.json

          echo "google-services.json found."
          echo "Firebase configuration ready."

      # ---------------------------------------------------------
      # 7. BUILD WATCHKEEPER 4
      # ---------------------------------------------------------
      - name: Build WATCHKEEPER 4
        script: |
          set -e

          flutter clean
          flutter pub get

          flutter build apk \
            --debug \
            --build-name=4.0.0 \
            --build-number=4

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
