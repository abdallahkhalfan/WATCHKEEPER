workflows:
  watchkeeper-android:
    name: WATCHKEEPER Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Recreate modern Android project
        script: |
          rm -rf android
          flutter create --platforms=android .

      - name: Remove generated test and lint files
        script: |
          rm -rf test
          rm -f analysis_options.yaml

      - name: Fix WATCHKEEPER icon
        script: |
          sed -i '' 's/Icons.location_home_rounded/Icons.home_rounded/g' lib/main.dart || \
          sed -i 's/Icons.location_home_rounded/Icons.home_rounded/g' lib/main.dart

      - name: Configure Android for WATCHKEEPER
        script: |
          python3 <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
          """

          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n' + permissions
          )

          manifest.write_text(text)

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()

          g = g.replace(
              "compileOptions {",
              """compileOptions {
                  isCoreLibraryDesugaringEnabled = true"""
          )

          if "coreLibraryDesugaring(" not in g:
              g += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          """

          gradle.write_text(g)
          PY

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
