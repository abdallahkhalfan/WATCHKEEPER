workflows:
  watchkeeper-5-android:
      name: WATCHKEEPER 5 Premium Android APK
          instance_type: mac_mini_m2
              max_build_duration: 60

                  environment:
                        flutter: stable

                            scripts:
                                  - name: Recreate Android project
                                          script: |
                                                    rm -rf android test analysis_options.yaml
                                                              flutter create \
                                                                          --platforms=android \
                                                                                      --org com.abdallahkhalfan \
                                                                                                  --project-name watchkeeper \
                                                                                                              .
                                                                                                                        rm -rf test
                                                                                                                                  rm -f analysis_options.yaml

                                                                                                                                        - name: Install Firebase configuration
                                                                                                                                                script: |
                                                                                                                                                          cp google-services.json android/app/google-services.json

                                                                                                                                                                - name: Configure Android
                                                                                                                                                                        script: |
                                                                                                                                                                                  python3 <<'PY'
                                                                                                                                                                                            from pathlib import Path

                                                                                                                                                                                                      manifest = Path("android/app/src/main/AndroidManifest.xml")
                                                                                                                                                                                                                text = manifest.read_text()

                                                                                                                                                                                                                          permissions = """\
                                                                                                                                                                                                                                        <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                                                                                                                                                                                                                                                      <uses-permission android:name="android.permission.VIBRATE" />
                                                                                                                                                                                                                                                                    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
                                                                                                                                                                                                                                                                                  <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
                                                                                                                                                                                                                                                                                                <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                                                                                                                                                                                                                                                                                                              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                                                                                                                                                                                                                                                                                                                            <uses-permission android:name="android.permission.CAMERA" />
                                                                                                                                                                                                                                                                                                                                          <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
                                                                                                                                                                                                                                                                                                                                                        <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
                                                                                                                                                                                                                                                                                                                                                                  """

                                                                                                                                                                                                                                                                                                                                                                            text = text.replace(
                                                                                                                                                                                                                                                                                                                                                                                          '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                                                                                                                                                                                                                                                                                                                                                                                        '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\\n' + permissions
                                                                                                                                                                                                                                                                                                                                                                                                                  )

                                                                                                                                                                                                                                                                                                                                                                                                                            manifest.write_text(text)

                                                                                                                                                                                                                                                                                                                                                                                                                                      app_gradle = Path("android/app/build.gradle.kts")
                                                                                                                                                                                                                                                                                                                                                                                                                                                gradle = app_gradle.read_text()

                                                                                                                                                                                                                                                                                                                                                                                                                                                          if "isCoreLibraryDesugaringEnabled = true" not in gradle:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        gradle = gradle.replace(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          "compileOptions {",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            """compileOptions {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              isCoreLibraryDesugaringEnabled = true"""
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            )

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if "coreLibraryDesugaring(" not in gradle:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    gradle += """
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              dependencies {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                """

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          app_gradle.write_text(gradle)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    PY

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Get Flutter packages
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            flutter pub get

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Analyze WATCHKEEPER
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    flutter analyze --no-fatal-infos

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          - name: Build WATCHKEEPER 5 APK
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            flutter build apk --debug

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                artifacts:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      - build/app/outputs/flutter-apk/*.apk