workflows:
  watchkeeper-5-android:
    name: WATCHKEEPER 5 Premium Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android project
        script: |
          set -e
          rm -rf android test analysis_options.yaml
          flutter create --platforms=android --org com.abdallahkhalfan --project-name watchkeeper .
          rm -rf test
          rm -f analysis_options.yaml

      - name: Install Firebase configuration
        script: |
          set -e
          test -f google-services.json
          test -d android/app
          cp google-services.json android/app/google-services.json

      - name: Configure Android
        script: |
          set -e
          python3 <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          perms = '''    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          '''
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text = text.replace(marker, marker + '\n' + perms)

          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace('</application>', receivers + '\n    </application>')
          manifest.write_text(text)

          app = Path('android/app/build.gradle.kts')
          g = app.read_text()
          if 'isCoreLibraryDesugaringEnabled = true' not in g:
              g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          if 'coreLibraryDesugaring(' not in g:
              g += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          app.write_text(g)
          PY

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Analyze WATCHKEEPER
        script: |
          flutter analyze --no-fatal-infos

      - name: Build WATCHKEEPER 5 APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
