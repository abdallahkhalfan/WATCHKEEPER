workflows:
  watchkeeper-android:
    name: WATCHKEEPER Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Recreate modern Android project
        script: |
          rm -rf android test analysis_options.yaml
          flutter create --platforms=android .
          rm -rf test
          rm -f analysis_options.yaml
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build WATCHKEEPER 3
        script: |
          flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
