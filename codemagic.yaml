workflows:
  android-watchkeeper:
    name: WATCHKEEPER Android APK
    max_build_duration: 60
    environment:
      flutter: stable

    scripts:
      - name: Create modern Flutter Android project files
        script: |
          flutter create --platforms=android .
      
      - name: Get dependencies
        script: |
          flutter pub get
      
      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
