workflows:
  watchkeeper-5-android:
      name: WATCHKEEPER 5 Premium Android APK
          instance_type: mac_mini_m2
              max_build_duration: 60
                  environment:
                        flutter: stable
                            scripts:
                                  - name: Recreate modern Android project
                                          script: |
                                                    set -e
                                                              rm -rf android test analysis_options.yaml
                                                                        flutter create --platforms=android --org com.abdallahkhalfan .
                                                                                  rm -rf test
                                                                                            rm -f analysis_options.yaml
                                                                                                  - name: Install Firebase configuration
                                                                                                          script: |
                                                                                                                    set -e
                                                                                                                              test -f google-services.json || (echo 'google-services.json missing from repository root' && exit 1)
                                                                                                                                        cp google-services.json android/app/google-services.json
                                                                                                                                              - name: Configure Android, Firebase and notifications
                                                                                                                                                      script: |
                                                                                                                                                                set -e
                                                                                                                                                                          python3 <<'PY'
                                                                                                                                                                                    from pathlib import Path
                                                                                                                                                                                              m=Path('android/app/src/main/AndroidManifest.xml'); x=m.read_text()
                                                                                                                                                                                                        marker='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
                                                                                                                                                                                                                  perms='''
                                                                                                                                                                                                                                <uses-permission android:name="android.permission.INTERNET" />
                                                                                                                                                                                                                                              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                                                                                                                                                                                                                                                            <uses-permission android:name="android.permission.VIBRATE" />
                                                                                                                                                                                                                                                                          <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
                                                                                                                                                                                                                                                                                        <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
                                                                                                                                                                                                                                                                                                      <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
                                                                                                                                                                                                                                                                                                                    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
                                                                                                                                                                                                                                                                                                                                  <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
                                                                                                                                                                                                                                                                                                                                                <uses-permission android:name="android.permission.CAMERA" />
                                                                                                                                                                                                                                                                                                                                                              <uses-permission android:name="android.permission.RECORD_AUDIO" />
                                                                                                                                                                                                                                                                                                                                                                        '''
                                                                                                                                                                                                                                                                                                                                                                                  if 'POST_NOTIFICATIONS' not in x: x=x.replace(marker,marker+perms)
                                                                                                                                                                                                                                                                                                                                                                                            recv='''
                                                                                                                                                                                                                                                                                                                                                                                                          <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                                                                                                                                                                                                                                                                                                                                                                                                                        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter>
                                                                                                                                                                                                                                                                                                                                                                                                                                                      </receiver>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                '''
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if 'ScheduledNotificationReceiver' not in x:x=x.replace('</application>',recv+'\n</application>')
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    m.write_text(x)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              s=Path('android/settings.gradle.kts'); y=s.read_text()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if 'com.google.gms.google-services' not in y:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    y=y.replace('id("com.android.application") version', 'id("com.google.gms.google-services") version "4.4.3" apply false\n    id("com.android.application") version',1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              s.write_text(y)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        g=Path('android/app/build.gradle.kts'); z=g.read_text()
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if 'id("com.google.gms.google-services")' not in z:z=z.replace('id("com.android.application")','id("com.android.application")\n    id("com.google.gms.google-services")',1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if 'isCoreLibraryDesugaringEnabled = true' not in z:z=z.replace('compileOptions {','compileOptions {\n        isCoreLibraryDesugaringEnabled = true',1)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if 'coreLibraryDesugaring(' not in z:z+='''\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'''
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                g.write_text(z)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          PY
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                - name: Get Flutter packages
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        script: flutter pub get
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              - name: Analyze WATCHKEEPER 5
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      script: flutter analyze
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            - name: Show Android SHA fingerprints
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    script: |
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              cd android
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        chmod +x gradlew
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  ./gradlew signingReport
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            cd ..
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - name: Build WATCHKEEPER 5 Premium
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          script: flutter build apk --debug
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              artifacts:
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    - build/app/outputs/flutter-apk/*.apk
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    