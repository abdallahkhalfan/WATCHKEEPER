workflows:
  watchkeeper-android:
    name: WATCHKEEPER 4 Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Recreate Android project
        script: |
          set -e
          rm -rf android test analysis_options.yaml
          flutter create --org com.abdallahkhalfan --platforms=android .
          rm -rf test analysis_options.yaml

      - name: Configure Firebase and Android
        script: |
          set -e
          test -f google-services.json
          cp google-services.json android/app/google-services.json
          python3 <<'PY'
          from pathlib import Path
          settings=Path("android/settings.gradle.kts")
          s=settings.read_text()
          gp='id("com.google.gms.google-services") version "4.4.4" apply false'
          if gp not in s:
              i=s.find("plugins {")
              j=s.find("\n",i)+1
              s=s[:j]+"    "+gp+"\n"+s[j:]
              settings.write_text(s)

          app=Path("android/app/build.gradle.kts")
          g=app.read_text()
          if 'id("com.google.gms.google-services")' not in g:
              g=g.replace('id("com.android.application")','id("com.android.application")\n    id("com.google.gms.google-services")',1)
          if "isCoreLibraryDesugaringEnabled = true" not in g:
              g=g.replace("compileOptions {","compileOptions {\n        isCoreLibraryDesugaringEnabled = true",1)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in g:
              g+='''\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n}\n'''
          app.write_text(g)

          manifest=Path("android/app/src/main/AndroidManifest.xml")
          x=manifest.read_text()
          root='<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms="""
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.VIBRATE" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
    <uses-permission android:name="android.permission.CAMERA" />
"""
          if "POST_NOTIFICATIONS" not in x:x=x.replace(root,root+perms)
          receivers="""
        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
            <intent-filter>
                <action android:name="android.intent.action.BOOT_COMPLETED"/>
                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
            </intent-filter>
        </receiver>
"""
          if "ScheduledNotificationReceiver" not in x:x=x.replace("</application>",receivers+"\n    </application>")
          manifest.write_text(x)
          PY

      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build WATCHKEEPER 4
        script: flutter build apk --debug --build-name=4.0.0 --build-number=4
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
