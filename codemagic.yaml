workflows:
  watchkeeper-5-android:
    name: WATCHKEEPER 5 Premium Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Recreate Android project
        script: |
          set -e
          rm -rf android test analysis_options.yaml

          flutter create \
            --platforms=android \
            --org com.abdallahkhalfan \
            --project-name watchkeeper \
            .

          rm -rf test
          rm -f analysis_options.yaml

      - name: Install Firebase configuration
        script: |
          set -e
          test -f google-services.json
          cp google-services.json android/app/google-services.json

      - name: Configure Firebase Gradle plugin
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()

          if 'id("com.google.gms.google-services") version "4.5.0" apply false' not in text:
              marker = 'id("com.android.application")'
              lines = text.splitlines()

              inserted = False
              out = []

              for line in lines:
                  out.append(line)

                  if (
                      not inserted
                      and 'id("com.android.application")' in line
                  ):
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(
                          indent +
                          'id("com.google.gms.google-services") '
                          'version "4.5.0" apply false'
                      )
                      inserted = True

              text = "\n".join(out) + "\n"

          settings.write_text(text)

          app = Path("android/app/build.gradle.kts")
          text = app.read_text()

          if 'id("com.google.gms.google-services")' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n'
                  '    id("com.google.gms.google-services")',
                  1,
              )

          if "isCoreLibraryDesugaringEnabled = true" not in text:
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1,
              )

          if "coreLibraryDesugaring(" not in text:
              text += '''
          dependencies {
              coreLibraryDesugaring(
                  "com.android.tools:desugar_jdk_libs:2.1.4"
              )
          }
          '''

          app.write_text(text)
          PY

      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      - name: Analyze WATCHKEEPER
        script: |
          flutter analyze --no-fatal-infos

      - name: Build WATCHKEEPER 5 APK
        script: |
          set -e
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk