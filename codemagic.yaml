workflows:
  android-watchkeeper:
    name: WATCHKEEPER Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Create Flutter platform files if needed
        script: flutter create . --project-name watchkeeper
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
