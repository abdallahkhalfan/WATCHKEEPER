workflows:
  watchkeeper-android:
    name: WATCHKEEPER 4 Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      # ---------------------------------------------------------
      # 1. Recreate a clean modern Android project
      # ---------------------------------------------------------
      - name: Recreate modern Android project
        script: |
          set -e

          echo "=== Recreating WATCHKEEPER Android project ==="

          rm -rf android
          rm -rf test
          rm -f analysis_options.yaml

          flutter create \
            --platforms=android \
            --org com.abdallahkhalfan \
            .

          rm -rf test
          rm -f analysis_options.yaml

          echo "Android project recreated successfully."

      # ---------------------------------------------------------
      # 2. Install Firebase google-services.json
      # ---------------------------------------------------------
      - name: Install Firebase configuration
        script: |
          set -e

          echo "=== Installing Firebase configuration ==="

          if [ ! -f "google-services.json" ]; then
            echo "ERROR: google-services.json was not found in repository root."
            exit 1
          fi

          cp google-services.json android/app/google-services.json

          echo "Firebase configuration installed."

      # ---------------------------------------------------------
      # 3. Configure Android permissions, notifications,
      #    Firebase Google Services and desugaring
      # ---------------------------------------------------------
      - name: Configure WATCHKEEPER Android
        script: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          # =====================================================
          # AndroidManifest.xml
          # =====================================================

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          """

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          if "android.permission.POST_NOTIFICATIONS" not in text:
              text = text.replace(
                  marker,
                  marker + "\n" + permissions
              )

          receivers = """
                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />

                  <receiver
                      android:exported="false"
                      android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">

                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>

                  </receiver>
          """

          if "ScheduledNotificationReceiver" not in text:
              text = text.replace(
                  "</application>",
                  receivers + "\n    </application>"
              )

          manifest.write_text(text)

          # =====================================================
          # android/settings.gradle.kts
          # Add Google Services Gradle plugin
          # =====================================================

          settings = Path("android/settings.gradle.kts")

          if settings.exists():
              s = settings.read_text()

              if "com.google.gms.google-services" not in s:
                  target = 'id("com.android.application")'

                  index = s.find(target)

                  if index != -1:
                      line_end = s.find("\n", index)

                      plugin_line = '\n    id("com.google.gms.google-services") version "4.4.3" apply false'

                      s = s[:line_end] + plugin_line + s[line_end:]

                  else:
                      print("WARNING: Could not automatically insert Google Services plugin.")

              settings.write_text(s)

          # =====================================================
          # android/app/build.gradle.kts
          # =====================================================

          gradle = Path("android/app/build.gradle.kts")
          g = gradle.read_text()

          # Add Google Services plugin to app
          if 'id("com.google.gms.google-services")' not in g:
              target = 'id("com.android.application")'

              if target in g:
                  g = g.replace(
                      target,
                      target + '\n    id("com.google.gms.google-services")',
                      1
                  )

          # Enable Java 8+ desugaring
          if "isCoreLibraryDesugaringEnabled = true" not in g:
              if "compileOptions {" in g:
                  g = g.replace(
                      "compileOptions {",
                      """compileOptions {
                  isCoreLibraryDesugaringEnabled = true""",
                      1
                  )

          # Add desugaring dependency
          if "coreLibraryDesugaring(" not in g:
              g += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          """

          gradle.write_text(g)

          print("WATCHKEEPER Android configuration completed.")
          PY

      # ---------------------------------------------------------
      # 4. Check Flutter installation
      # ---------------------------------------------------------
      - name: Flutter environment
        script: |
          flutter --version
          flutter doctor -v

      # ---------------------------------------------------------
      # 5. Get packages
      # ---------------------------------------------------------
      - name: Get Flutter packages
        script: |
          set -e
          flutter pub get

      # ---------------------------------------------------------
      # 6. Check Firebase configuration
      # ---------------------------------------------------------
      - name: Verify Firebase configuration
        script: |
          set -e

          echo "=== Firebase configuration ==="

          if [ -f android/app/google-services.json ]; then
            echo "google-services.json found successfully."
          else
            echo "ERROR: android/app/google-services.json missing."
            exit 1
          fi

      # ---------------------------------------------------------
      # 7. Show SHA-1 and SHA-256
      # ---------------------------------------------------------
      - name: Show Android SHA fingerprints
        script: |
          set -e

          echo "========================================="
          echo " WATCHKEEPER ANDROID CERTIFICATE"
          echo "========================================="

          cd android

          chmod +x gradlew

          ./gradlew signingReport

          cd ..

          echo "========================================="
          echo "Look above for:"
          echo "Variant: debug"
          echo "SHA1:"
          echo "SHA-256:"
          echo "========================================="

      # ---------------------------------------------------------
      # 8. Analyze Flutter project
      # Do not fail build for warnings
      # ---------------------------------------------------------
      - name: Analyze WATCHKEEPER
        script: |
          flutter analyze || true

      # ---------------------------------------------------------
      # 9. Build APK
      # ---------------------------------------------------------
      - name: Build WATCHKEEPER 4 APK
        script: |
          set -e

          echo "========================================="
          echo " BUILDING WATCHKEEPER 4"
          echo "========================================="

          flutter build apk --debug

          echo "WATCHKEEPER 4 APK BUILD COMPLETED."

      # ---------------------------------------------------------
      # 10. Verify generated APK
      # ---------------------------------------------------------
      - name: Verify WATCHKEEPER APK
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          if [ -f "$APK" ]; then
            echo "========================================="
            echo " WATCHKEEPER 4 APK READY"
            echo "========================================="
            ls -lh "$APK"
          else
            echo "ERROR: WATCHKEEPER APK was not generated."
            exit 1
          fi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/**/*.apk
