workflows:
  watchkeeper-android:
    name: WATCHKEEPER Android APK

    environment:
      flutter: stable

    scripts:
      - name: Recreate complete Android project
        script: |
          rm -rf android
          flutter create --platforms=android .

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
