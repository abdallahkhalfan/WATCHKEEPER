publish_to: "none"
version: 5.0.0+50

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.0.1
