  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  google_sign_in: ^7.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
